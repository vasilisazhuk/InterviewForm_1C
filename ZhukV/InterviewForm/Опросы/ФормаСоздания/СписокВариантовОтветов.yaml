ВидЭлемента: КомпонентИнтерфейса
Ид: 408fdde2-5391-4f51-a786-90cd0c7c65fd
Имя: СписокВариантовОтветов
ОбластьВидимости: ВПодсистеме
Импорт:
    - НСИ::Опросники
Наследует:
    Тип: ПроизвольныйСписок<ДинамическийСписок>
    ПриНажатииСтроки: ПроизвольныйСписокПриНажатииСтроки
    ТипКомпонентаСтроки: СтрокаПредставлениеВариантаОтвета
    Источник:
        ОсновнаяТаблица:
            Таблица: ZhukV::InterviewForm::НСИ::Опросники::ВариантыОтветаИзМножества
        Параметры:
            -
                Значение: =Опрос_св
                Имя: Опрос
            -
                Значение: =НомерВопроса_св
                Имя: Номер
        Поля:
            -
                Тип: ПолеДинамическогоСписка
                Выражение: Значение
            -
                Тип: ПолеДинамическогоСписка
                Выражение: НомерВарианта
        Фильтр:
            Элементы:
                -
                    Тип: ЭлементФильтраВыражение
                    Выражение: ВариантыОтветаИзМножества.Опрос==&Опрос
                    Использовать: Истина
                -
                    Тип: ЭлементФильтраВыражение
                    Выражение: ВариантыОтветаИзМножества.НомерВопроса==&Номер
                    Использовать: Истина
Свойства:
    -
        Имя: Опрос_св
        Тип: Опросы.Ссылка?
    -
        Имя: НомерВопроса_св
        Тип: Число
