ВидЭлемента: КомпонентИнтерфейса
Ид: 97dbb781-6d84-4c0f-9fa8-484f734823cb
Имя: ФормаВопрос
ОбластьВидимости: ВПроекте
Наследует:
    Тип: ФормаОбъекта<Вопрос.Объект>
    ВключатьВАвтоИнтерфейс: Ложь
    Заголовок: Вопрос
    ДополнительныеКоманды:
        Тип: ФрагментКомандногоИнтерфейса
        Элементы:
            - =Обновить
            - =СоздатьКопию
            - =СоздатьНаОсновании
            - =Удалить
            - =Восстановить
    ОбычныеКоманды:
        Тип: ФрагментКомандногоИнтерфейса
        Элементы:
            - =Записать
    ОсновнаяКоманда: =ЗаписатьИЗакрыть
    Содержимое:
        Тип: ПроизвольныйШаблонФормы
        ШиринаВКолонках: Четверная
        Содержимое:
            Тип: Группа
            Имя: ГруппаПолей
            Содержимое:
                -
                    Тип: ПолеВвода<ТипОтвета>
                    Имя: ТипВопроса
                    Значение: =Объект.ТипВопроса
                -
                    Тип: ПолеВвода<Строка>
                    Имя: Подсказка
                    Значение: =Объект.Подсказка
                -
                    Тип: ПолеВвода<Строка>
                    Имя: Текст
                    Заголовок: Текст вопроса
                    Значение: =Объект.Текст
                    НастройкиВводаСтроки:
                        Многострочная: Истина
                -
                    Тип: Таблица<ИсточникДанныхМассив<Вопрос.Варианты>>
                    Имя: Варианты
                    Видимость: =Объект.ТипВопроса == ТипОтвета.МножественныйВыбор или Объект.ТипВопроса == ТипОтвета.ОдиночныйВыбор
                    ИспользоватьОтметкиСтрок: Истина
                    Источник:
                        Данные: =Объект.Варианты
                    Колонки:
                        -
                            Тип: СтандартнаяКолонкаТаблицы<Вопрос.Варианты, Строка>
                            Имя: Варианты_Значение
                            Значение: =RowData.Значение
                    Команды:
                        Тип: ФрагментКомандногоИнтерфейса
                        Элементы:
                            - =Компоненты.Варианты.ДобавитьСтроку
                    КомандыНадОтмеченнымиСтроками:
                        Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Массив<Вопрос.Варианты>>>
                        Элементы:
                            - =Компоненты.Варианты.ПереместитьСтрокуВверх
                            - =Компоненты.Варианты.ПереместитьСтрокуВниз
                            - =Компоненты.Варианты.Удалить
                    КомандыСтроки:
                        Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Вопрос.Варианты>>
                        Элементы:
                            - =Компоненты.Варианты.ПереместитьСтрокуВверх
                            - =Компоненты.Варианты.ПереместитьСтрокуВниз
                            - =Компоненты.Варианты.Удалить
Свойства:
    -
        Имя: Опрос_св
        Тип: Опросы.Ссылка?
    -
        Имя: Номер_св
        Тип: Число
